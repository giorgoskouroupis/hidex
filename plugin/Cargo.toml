[package]
name = "hidex-panes"
version = "0.1.0"
edition = "2021"
description = "hIDEx's zellij plugin: jump to a pane by role, open a new terminal or Claude in its area"
license = "MIT"

[dependencies]
# must match the zellij that hIDEx bundles (tools.lock)
zellij-tile = "=0.46.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
