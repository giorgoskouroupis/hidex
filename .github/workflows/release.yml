# a version tag (v0.1.0…) builds hIDEx's release files (scripts/release: the core, the bundles) and publishes them,
# with the core's checksum (for install.sh), as that tag's release, its section of CHANGELOG.md as the text
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # kept between releases: the tools' downloads, the npm packages, the plugin's Rust build
      - uses: actions/cache@v4
        with:
          path: |
            dist/cache
            dist/store
            ~/.npm
            ~/.cargo/registry
            plugin/target
          key: release-${{ hashFiles('tools.lock', 'release/lsp/package-lock.json', 'plugin/Cargo.lock') }}
          restore-keys: release-
      - name: Rust with the wasm32-wasip1 target (the zellij plugin)
        run: rustup target add wasm32-wasip1
      - name: Plugin tests
        run: cd plugin && cargo test --locked
      - name: Build the archive
        run: |
          archive=$(scripts/release "$GITHUB_REF_NAME")
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Unit tests, on the installed archive
        run: tests/unit "$(tests/installed "$ARCHIVE")"
      - name: Release notes, from CHANGELOG.md
        run: |
          awk -v v="[$GITHUB_REF_NAME]" '$1 == "##" && $2 == v { on = 1; next } on && $1 == "##" { exit } on' \
            CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" dist/hidex-lsp-*.tar.gz dist/hidex-pudb-*.tar.gz \
            --title "hIDEx $GITHUB_REF_NAME" --notes-file notes.md
