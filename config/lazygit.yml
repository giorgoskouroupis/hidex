# hIDEx's own lazygit config (LG_CONFIG_FILE), the same on every machine. Kept in lazygit's current format:
# it lives in the read-only store, so lazygit cannot migrate it and would exit at start.
gui:
  theme:
    authorColors:
      "*": blue
git:
  # | switches between the two diff views
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
    - colorArg: always
      command: delta --paging=never --side-by-side
