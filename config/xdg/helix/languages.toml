# Language servers come with tIDEx (package.nix) for Python (basedpyright, ruff) and the files most projects
# have: shell, Markdown, TOML, Nix, YAML, JSON, HTML, CSS, JavaScript/TypeScript, Dockerfile. Others (rust-analyzer, gopls, …) are
# found on the PATH, e.g. from the project's dev shell; `hx --health LANG` or /langs shows what is missing.
[[language]]
name = "python"
language-servers = ["basedpyright", "ruff"]

# "standard", not basedpyright's default "recommended", which flags every unknown or partial type
# tidex-pyright: basedpyright on the project's Python (tidex-python, /python)
[language-server.basedpyright]
command = "tidex-pyright"
args = ["--stdio"]
config.basedpyright.analysis.typeCheckingMode = "standard"

[language-server.ruff]
command = "ruff"
args = ["server"]

# only the servers tIDEx brings (Helix would also try marksman, nixd, ansible, superhtml, tombi)
[[language]]
name = "markdown"
language-servers = ["markdown-oxide"]

[[language]]
name = "nix"
language-servers = ["nil"]

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]

[[language]]
name = "html"
language-servers = ["vscode-html-language-server"]

[[language]]
name = "toml"
language-servers = ["taplo"]
