# hIDEx's own Helix config (its hx runs with XDG_CONFIG_HOME pointing here; the machine's is not read).
# A copy of the usual settings, without Helix's own file explorer: the tree pane is the explorer.
theme = "hidex"

[editor]
bufferline = "multiple"
color-modes = true
cursorline = true
# diagnostics stay squiggles; their text shows only on the cursor line (all of them: space d)
end-of-line-diagnostics = "disable"

# borders around menus and documentation pop-ups
popup-border = "all"

# the branch next to the file name, and the file's encoding and line endings on the right
[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "workspace-diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"

# tabs shown (they matter in Python), other whitespace not
[editor.whitespace.render]
tab = "all"

[editor.auto-save]
focus-lost = true

[editor.cursor-shape]
insert = "bar"

[editor.indent-guides]
render = true

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal]
# Helix never reloads files changed on disk (e.g. by Claude): Ctrl+r does it
C-r = ":reload-all"

[keys.normal.space]
e = "no_op"
E = "no_op"
