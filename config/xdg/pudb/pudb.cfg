# hIDEx's pudb settings: they win over pudb's own settings screen, whose changes last only that session.
# Every on/off setting is written out: pudb 2025.1 prints an error for each one left unset.
[pudb]
shell = ipython
theme = @theme@
line_numbers = True
wrap_variables = True
prompt_on_quit = True
hide_cmdline_win = False
seen_welcome = e999
